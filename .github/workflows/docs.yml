name: Docs

# Publishes the MkDocs site to the gh-pages branch. In the repository settings, set
# Pages -> Source -> "Deploy from a branch" -> gh-pages / (root).
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "results/real/**", "src/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NO_MKDOCS_2_WARNING: "1"  # silence the MkDocs 2.0 banner; mkdocs is pinned <2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Refresh the synthetic validation page
        run: mapaudit demo --fresh
      - name: Deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --strict
