name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: "1"  # silence the MkDocs 2.0 banner; mkdocs is pinned <2

jobs:
  test:
    name: lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests (includes planted-bias validation and an end-to-end run)
        run: python -m pytest --cov=mapaudit --cov-report=term-missing

  notebooks:
    name: notebooks 01-06 (synthetic data)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Execute every analysis notebook in demo mode
        env:
          MAPAUDIT_NOTEBOOK_MODE: demo
        run: python -m pytest --nbmake notebooks/0[1-6]_*.ipynb -o addopts=""

  demo:
    name: synthetic end-to-end pipeline
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run every step on synthetic data
        run: mapaudit demo --fresh
      - name: Docs build (strict)
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v7
        with:
          name: demo-results
          path: |
            results/demo/tables
            results/demo/figures
