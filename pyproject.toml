[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mapaudit"
version = "0.1.0"
description = "Who the Map Misses: auditing machine-learning poverty maps for Indigenous communities in Mexico."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Cody Allen", email = "cody.allen.analytics@protonmail.com" }]
keywords = ["poverty mapping", "algorithmic audit", "small area estimation", "conformal prediction", "remote sensing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pyarrow>=15",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.17,<0.18",
  "mkdocs>=1.6,<2",          # MkDocs 2.0 drops the plugin system this site uses
  "mkdocs-material>=9.5,<10",
  "nbmake>=1.5",             # executes the notebooks in CI
  "ipykernel>=6.29",
]
notebooks = ["jupyterlab>=4.2"]
gee = ["earthengine-api>=1.0"]

[project.scripts]
mapaudit = "mapaudit.cli:main"

[project.urls]
Homepage = "https://github.com/cody-allen-analytics/who-the-map-misses"
Documentation = "https://cody-allen-analytics.github.io/who-the-map-misses/"

[tool.hatch.build.targets.wheel]
packages = ["src/mapaudit"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow Spanish characters in strings/comments

[tool.ruff.lint.per-file-ignores]
# Figure titles and generated prose are long strings; wrapping them hurts readability.
"src/mapaudit/plots.py" = ["E501"]
"src/mapaudit/report.py" = ["E501"]
"src/mapaudit/notebook.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
